<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}.v3-opts{left:10px;flex-wrap:wrap;align-items:center}.v3-opts label{background:#fffffff0;padding:6px 9px;border-radius:6px;font-size:12px}.v3-opts .btn{font-size:11px}.v3-opts~.v3-legend{font-size:11px}
</style></head><body><title>Raumplaner Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Arbeitsplatz wie ein Planungstisch – Foto als Bühne links, Möbel-Mappe rechts, Budget darunter als Abrechnung. */
:root{
  --bg:#eceeea; --surface:#fafbf8; --surface-2:#e2e7e1; --sunk:#d6ddd6;
  --ink:#18261f; --muted:#56655d; --faint:#7d8a83; --line:#cfd7d0;
  --accent:#2c5a4b; --accent-2:#3d7563; --accent-ink:#f5faf7; --accent-soft:#d5e4dc;
  --brass:#9a6b1f; --ok:#2f7a48; --warn:#a86a10; --bad:#b03f2c;
  --c1:#2c5a4b; --c2:#b0793a; --c3:#6f8fa8; --c4:#8a5a78; --c5:#7d9a4c; --c6:#c25a43; --c7:#5b6b8f;
  --check-a:#e6e9e4; --check-b:#f4f6f2;
  --shadow:0 1px 2px rgb(20 35 28 / .06), 0 8px 24px rgb(20 35 28 / .07);
  --f-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#18201c; --surface-2:#212b26; --sunk:#0c110e;
    --ink:#e3ebe6; --muted:#9fb0a7; --faint:#7a8a82; --line:#2c3832;
    --accent:#86c0a8; --accent-2:#a2d2bd; --accent-ink:#0d1a14; --accent-soft:#1f3a30;
    --brass:#dcae62; --ok:#7cc493; --warn:#e3ad55; --bad:#ec8470;
    --c1:#86c0a8; --c2:#d9a466; --c3:#8fb2cf; --c4:#c393b3; --c5:#a9c578; --c6:#e5856d; --c7:#9aa8d4;
    --check-a:#1d2622; --check-b:#252f2a;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201c; --surface-2:#212b26; --sunk:#0c110e;
  --ink:#e3ebe6; --muted:#9fb0a7; --faint:#7a8a82; --line:#2c3832;
  --accent:#86c0a8; --accent-2:#a2d2bd; --accent-ink:#0d1a14; --accent-soft:#1f3a30;
  --brass:#dcae62; --ok:#7cc493; --warn:#e3ad55; --bad:#ec8470;
  --c1:#86c0a8; --c2:#d9a466; --c3:#8fb2cf; --c4:#c393b3; --c5:#a9c578; --c6:#e5856d; --c7:#9aa8d4;
  --check-a:#1d2622; --check-b:#252f2a;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--faint)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand-name small{font-family:var(--f-body);font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.topbar .spacer{flex:1}
.save-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.save-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-chip[data-s="saving"] .dot{background:var(--warn)}
.save-chip[data-s="mem"] .dot{background:var(--bad)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;gap:6px}
.btn.sm svg.i{width:16px;height:16px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.flat{border-color:transparent;background:transparent}
.icon-btn.flat:hover{background:var(--surface-2)}

/* Forms */
.field{display:grid;gap:6px;min-width:0}
.field>span,.lbl{font-size:13px;font-weight:500;color:var(--ink)}
.input,select.input,textarea.input{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
textarea.input{min-height:64px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--faint)}
.money{position:relative}
.money .input{padding-right:30px;font-variant-numeric:tabular-nums}
.money>em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--faint);font-size:13px;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inline{display:flex;gap:8px}
.inline .input{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- Home ---------- */
.home{padding-block:44px 64px;display:grid;gap:40px}
.home-head{display:grid;gap:14px;max-width:660px}
.display{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,5.2vw,54px);line-height:1.04;letter-spacing:-.02em}
.display em{font-weight:400;font-style:italic;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);max-width:56ch}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.room-new{display:grid;align-content:center;justify-items:start;gap:10px;min-height:250px;padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);background:transparent;cursor:pointer;text-align:left;color:var(--ink)}
.room-new:hover{border-color:var(--accent);background:var(--surface)}
.room-new .plus{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.room-new strong{font-size:16px}
.room-card{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s, box-shadow .15s;position:relative}
.room-card:hover{transform:translateY(-2px)}
.room-thumb{aspect-ratio:16/10;background:var(--surface-2) center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--faint)}
.room-thumb .badge{position:absolute;left:10px;top:10px}
.room-body{padding:14px 16px 16px;display:grid;gap:8px}
.room-body h3{font-size:16.5px;font-weight:600}
.room-meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.room-actions{position:absolute;right:8px;top:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.room-card:hover .room-actions,.room-card:focus-within .room-actions{opacity:1}
.room-actions .icon-btn{background:var(--surface);box-shadow:var(--shadow)}
@media (hover:none){.room-actions{opacity:1}}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}
.bar.near>i{background:var(--warn)}
.steps{list-style:none;margin:0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:s}
.steps li{display:grid;gap:4px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:26px;color:var(--accent);line-height:1}
.steps strong{font-weight:600}
.steps p{font-size:14px;color:var(--muted)}
.backup{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.backup p{flex:1 1 280px}
.notice{padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--warn);margin-top:2px}

/* ---------- Editor ---------- */
.editor{padding-block:20px 56px;display:grid;gap:20px}
.ed-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ed-title{flex:1 1 240px;min-width:0;display:grid;gap:0}
.name-input{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.015em;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:0 6px;margin-left:-7px;width:100%;min-width:0}
.name-input:hover{border-color:var(--line)}
.name-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ed-mini{display:grid;gap:5px;min-width:200px;font-size:13px}
.ed-mini .top{display:flex;justify-content:space-between;gap:12px}
.ed-mini strong{font-variant-numeric:tabular-nums}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.ed-main{display:grid;gap:14px;min-width:0}
.canvas-card{overflow:hidden}
.photo-tabs{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ptab{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:transparent;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.ptab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500;margin-bottom:-1px}
.ptab .x{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--faint)}
.ptab .x:hover{background:var(--surface-2);color:var(--bad)}
.ptab .x svg{width:14px;height:14px}
.ptab.add{padding:0 12px;color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
/* Bedienhinweis: einzeilig in einer eigenen schmalen Zeile unter den Knöpfen (neben ihnen ist kein Platz mehr, dort brach er Wort für Wort um) */
.toolbar .tip{order:9;flex:1 1 100%;min-width:0;margin:-1px 2px 0;font-size:12.5px;line-height:16px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .tip:empty{display:none}
.toolbar [data-act="export-png"]{margin-left:auto}
.stage{position:relative;background:var(--sunk);padding:14px;display:grid;place-items:center}
.stage-inner{position:relative;width:min(100%, calc(66vh * var(--ar)));aspect-ratio:var(--ar);max-width:100%;border-radius:4px;overflow:hidden;user-select:none;-webkit-user-select:none;background:#000}
.stage-inner .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.layer{position:absolute;inset:0}
.hide-furn .layer{display:none}
.pl{position:absolute;touch-action:none;cursor:grab}
.pl:active{cursor:grabbing}
.pl img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.pl.sel{outline:1.5px dashed #fff;outline-offset:2px;box-shadow:0 0 0 1px rgb(0 0 0 / .35)}
.hd{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #2c5a4b;box-shadow:0 1px 4px rgb(0 0 0 / .35);touch-action:none;z-index:2}
.hd[data-h="resize"]{cursor:nwse-resize}
.hd.tl{left:-10px;top:-10px}.hd.tr{right:-10px;top:-10px;cursor:nesw-resize}.hd.bl{left:-10px;bottom:-10px;cursor:nesw-resize}.hd.br{right:-10px;bottom:-10px}
.hd.rot{left:50%;top:-38px;transform:translateX(-50%);cursor:grab;background:#2c5a4b;border-color:#fff}
.hd.rot::after{content:"";position:absolute;left:50%;top:14px;width:1.5px;height:16px;background:#fff;transform:translateX(-50%)}
.pl-tag{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);max-width:calc(100% + 60px);overflow:hidden;text-overflow:ellipsis;background:rgb(17 26 22 / .82);color:#f2f6f3;font-size:11.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none;font-family:var(--f-mono)}
.measuring{cursor:crosshair}
.measure-layer{position:absolute;inset:0;pointer-events:none}
.measure-layer svg{position:absolute;inset:0;width:100%;height:100%}
.mdot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#f0c24b;border:2px solid #1a1a1a}
.mlabel{position:absolute;transform:translate(-50%,-140%);background:#f0c24b;color:#1a1a1a;font:600 12px var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap}
.empty-stage{display:grid;justify-items:center;text-align:center;gap:12px;padding:40px 18px;max-width:460px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);width:100%}
.empty-stage.drag{border-color:var(--accent);background:var(--accent-soft)}
.empty-stage .ill{width:84px;height:84px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.empty-stage .ill svg{width:38px;height:38px}
.empty-stage h3{font-family:var(--f-display);font-size:23px;font-weight:600}
.empty-stage .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.inspector{padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.insp{display:grid;gap:12px}
.insp-head{display:flex;align-items:center;gap:12px}
.insp-head .th{width:44px;height:44px;border-radius:6px;flex:none}
.insp-head .t{flex:1;min-width:0}
.insp-head strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-head span{font-size:12.5px;color:var(--muted)}
.insp-ctrls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px}
.rng{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.rng b{font-weight:500;color:var(--ink);font-family:var(--f-mono);font-size:11.5px;float:right}
.rng input{width:100%;accent-color:var(--accent)}
.insp-btns{display:flex;flex-wrap:wrap;gap:6px}
.insp-empty{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.insp-empty .grow{flex:1;min-width:200px}
.scale-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.scale-chip button{border:0;background:transparent;cursor:pointer;color:var(--faint);display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
.scale-chip button:hover{color:var(--bad);background:var(--surface)}

.checker{background-color:var(--check-b);background-image:conic-gradient(var(--check-a) 25%, transparent 0 50%, var(--check-a) 0 75%, transparent 0);background-size:14px 14px}
.th{object-fit:contain}

/* Side */
.ed-side{display:flex;flex-direction:column;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 92px)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;margin:12px 12px 0;background:var(--surface-2);border-radius:9px}
.seg button{border:0;background:transparent;min-height:34px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-variant-numeric:tabular-nums}
.side-body{padding:14px;display:grid;gap:14px;overflow-y:auto;align-content:start}
.grp{display:grid;gap:8px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:4px}
.grp-h h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grp-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.it{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.it.alt{border-style:dashed;background:transparent}
.it-thumb{width:64px;height:64px;border-radius:6px;display:grid;place-items:center;overflow:hidden}
.it-thumb img{max-width:90%;max-height:90%;object-fit:contain}
.it-body{display:grid;gap:3px;min-width:0}
.it-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.it-top h5{margin:0;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.it-meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.it-price{font-size:13.5px;font-variant-numeric:tabular-nums}
.it-price .open{color:var(--warn)}
.it-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.pill.idee{color:var(--muted)}
.pill.favorit{color:var(--brass)}
.pill.gekauft{color:var(--ok)}
.pill.alt{color:var(--faint);border-style:dashed}
.side-empty{display:grid;gap:10px;justify-items:center;text-align:center;padding:26px 10px;color:var(--muted)}
.side-empty svg{width:30px;height:30px;color:var(--faint)}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop{display:grid;gap:2px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--surface);position:relative}
.shop:hover{border-color:var(--accent);background:var(--accent-soft)}
.shop strong{font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px}
.shop strong svg{width:14px;height:14px;color:var(--faint)}
.shop span{font-size:11.5px;color:var(--muted)}
.shop .tagline{color:var(--brass)}
.shop.fit{border-color:var(--accent)}
.shop .pf{font-style:normal;font-size:10.5px;color:var(--ok)}
.shops-more{grid-column:1 / -1}
.paste-box{display:grid;gap:8px;padding:12px;border-radius:9px;background:var(--surface-2)}

/* Budget */
.budget{padding:20px}
.budget-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.budget-head h2{font-family:var(--f-display);font-size:24px;font-weight:600}
.budget-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr) minmax(0,.9fr);gap:28px}
.budget-grid>div{min-width:0;display:grid;gap:12px;align-content:start}
.budget-grid h3{font-size:13px;font-weight:600}
.big{font-family:var(--f-display);font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.stack{position:relative;height:16px;border-radius:5px;background:var(--surface-2);display:flex;overflow:hidden}
.stack>i{display:block;height:100%}
.stack-wrap{position:relative}
.stack-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.stats div{padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.stats .neg dd{color:var(--bad)}
.stats .pos dd{color:var(--ok)}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th{font-size:11.5px;font-weight:600;text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
.ctab td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.ctab td.r,.ctab th.r{text-align:right}
.ctab .cname{display:flex;align-items:center;gap:8px}
.ctab .cname i{width:9px;height:9px;border-radius:2px;flex:none}
.ctab .money{width:104px;margin-left:auto}
.ctab .money .input{min-height:32px;padding:4px 26px 4px 8px;font-size:13px}
.ctab .bar{margin-top:5px;height:4px}
.st{font-size:11.5px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.none{color:var(--faint);font-weight:400}
.ship{display:grid;gap:8px}
.ship-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ship-row span{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.ship-row .money{width:110px;flex:none}
.ship-row .money .input{min-height:34px}
.warnline{font-size:12.5px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.warnline svg{width:15px;height:15px;margin-top:2px}
.tbl-wrap{overflow-x:auto}

/* Dialog */
dialog.dlg{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(720px, calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 70px rgb(0 0 0 / .3)}
dialog.dlg.narrow{width:min(440px, calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgb(10 16 13 / .5)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.dlg-h h2{font-family:var(--f-display);font-size:22px;font-weight:600}
.dlg-b{padding:4px 20px 18px;overflow-y:auto;display:grid;gap:14px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .grow{flex:1}
.item-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.imgbox{display:grid;gap:8px;align-content:start}
.drop{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;text-align:center;cursor:pointer;position:relative;overflow:hidden;padding:10px}
.drop.drag{border-color:var(--accent)}
.drop img{max-width:100%;max-height:100%;object-fit:contain}
.drop .ph{display:grid;gap:6px;justify-items:center;font-size:12.5px;color:var(--muted)}
.drop .ph svg{width:28px;height:28px;color:var(--faint)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.segbtns{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:8px}
.segbtns button{flex:1;border:0;background:transparent;min-height:32px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted)}
.segbtns button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.list-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.list-tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.list-tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.list-tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list-tbl tr.sub td{font-weight:600;border-bottom:2px solid var(--line)}
.list-tbl tr.ret td{padding-top:16px;font-family:var(--f-display);font-size:16px;font-weight:600;border-bottom:none}
.list-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px}
.copy-area{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.stage-inner.plan{width:min(100%, calc(80vh * var(--ar)))}
.plan .pl.sel{outline:2px dashed #2c5a4b;outline-offset:3px;box-shadow:none}
.plan .pl.warn img{outline:2.5px solid #c0392b;outline-offset:-2px}
.pl-lbl{position:absolute;left:50%;top:50%;font:600 10.5px/1.25 var(--f-body);color:#1d2622;background:rgb(255 255 255 / .78);padding:1px 6px;border-radius:4px;white-space:nowrap;text-align:center;pointer-events:none}
.pl-lbl .mono{font-size:9.5px;font-weight:500}
/* Audio, 3D, Hausplan, Dachkanten, Freistellen */
.ov-layer{position:absolute;inset:0;pointer-events:none;z-index:500}
.ov-layer svg{position:absolute;inset:0;width:100%;height:100%}
.ov-layer [data-spk]{pointer-events:all;cursor:grab;touch-action:none}
.v3-wrap{position:relative;width:100%;height:min(74vh,720px);border-radius:4px;overflow:hidden;background:#e3e7e0}
.v3-opts{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.v3-opts .btn{background:rgb(255 255 255 / .92)}
.v3{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v3-legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;background:rgb(255 255 255 / .9);color:#1d2622;font-size:12px;padding:6px 10px;border-radius:8px;max-width:calc(100% - 20px);pointer-events:none}
.v3-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.v3-msg{position:absolute;inset:0;display:grid;place-items:center;color:#56655d;font-size:14px;text-align:center;padding:20px;pointer-events:none}
.okline{color:var(--ok);font-size:12.5px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.okline svg,.hint svg{width:15px;height:15px;flex:none;margin-top:1px;vertical-align:-2px}
.fit-list{margin:2px 0 0;padding-left:18px;font-size:12.5px}
.aud-ic{width:44px;height:44px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.aud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;align-items:end}
.aud-grid .segbtns button{padding:0 8px}
.scan-box{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;justify-self:center;max-width:100%;width:max-content}
.scan-box img{display:block;max-width:100%;max-height:50vh;pointer-events:none}
.scan-rect{position:absolute;border:2px solid #2c5a4b;background:rgb(44 90 75 / .12);box-shadow:0 0 0 9999px rgb(0 0 0 / .2);pointer-events:none}
.roof-box{position:relative;justify-self:center;max-width:100%;width:max-content}
.roof-box img{display:block;max-width:100%;max-height:48vh;border-radius:6px}
.roof-box svg{position:absolute;inset:0;width:100%;height:100%}
.ce-stage{position:relative;justify-self:center;max-width:100%;width:max-content;border-radius:8px;overflow:hidden;touch-action:none}
.ce-stage canvas{display:block;max-width:100%;max-height:56vh;cursor:crosshair}
.ce-sel{position:absolute;border:2px dashed #2c5a4b;background:rgb(44 90 75 / .12);pointer-events:none}
#ce-mode button{display:inline-flex;align-items:center;gap:6px;padding:0 12px}
#ce-mode svg{width:15px;height:15px}
.pagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pagegrid button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;cursor:pointer;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pagegrid button:hover{border-color:var(--accent)}
.pg-th{display:block;min-height:120px;background:var(--surface-2);border-radius:4px}
.pg-th img{width:100%;height:auto;display:block}
.num-in{width:84px;min-height:30px;padding:3px 8px}
.furnish{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:6px}
.furnish h4{font-size:14px;font-weight:600}
.furnish>.btn,.insp-up>.btn{white-space:normal;text-align:center;padding-block:8px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;min-height:30px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
dialog.dlg:has(.dlg-in.wide){width:min(1080px, calc(100vw - 24px))}
.mb-pal{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink)}
.mb-pal i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:6px;vertical-align:-4px;border:1px solid rgb(0 0 0 / .15)}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mb-card{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);color:var(--ink);text-decoration:none}
.mb-card:hover{border-color:var(--accent)}
.mb-img{display:grid;place-items:center;aspect-ratio:1.15;padding:10px;background-color:#fff}
.mb-img img{max-width:100%;max-height:100%;object-fit:contain}
.mb-t{display:grid;gap:2px;padding:9px 11px 11px;font-size:12.5px}
.mb-t strong{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mb-t span{color:var(--muted)}
.mb-t b{color:var(--accent);font-size:14px}
.mb-check{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
.mb-check summary{cursor:pointer;font-weight:600}
.mb-check ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:13px;color:var(--ink);line-height:1.45}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.style-card{display:grid;gap:5px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:12.5px}
.idea-group{display:grid;gap:10px;margin:16px 0;scroll-margin-top:24px}.idea-card{padding:12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:8px;min-width:0;background:var(--surface)}.idea-card h5{font-size:13px;margin:0;overflow-wrap:anywhere}.idea-card .row{flex-wrap:wrap}.idea-card img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:8px}.idea-card a{overflow-wrap:anywhere}.idea-meta{font-size:12px;color:var(--muted)}
.style-card b{font-weight:600}
.style-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sw-row{display:flex;gap:0;border-radius:5px;overflow:hidden;height:12px}
.sw-row i{flex:1}
.sw-row.big{height:18px;max-width:220px}
.insp-up{display:grid;gap:6px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface)}
.insp-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.insp-card>img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:7px}
.insp-t{display:grid;gap:6px;min-width:0}
.insp-t .tips{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.set-card{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.set-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.set-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.set-thumbs span{background:#fff;aspect-ratio:1;display:grid;place-items:center;padding:4px;min-width:0;overflow:hidden}
.set-thumbs img{max-width:100%;max-height:100%;object-fit:contain}
.set-b{display:grid;gap:7px;padding:10px 12px 12px}
.set-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.set-f{display:flex;align-items:center;gap:8px}
.set-f b{font-size:16px}
.set-f .grow{flex:1}
.pill.tier{color:var(--muted)}
.pill.match{color:var(--brass)}
.mb-insp{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mb-insp img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:6px}
@media (max-width:680px){ .insp-card{grid-template-columns:64px minmax(0,1fr)} .insp-card>img{width:64px;height:64px} }
/* Vorher / Nachher */
.ptab.cmp-tab{color:var(--ink);font-weight:500;padding-right:12px}
.ptab.cmp-tab svg{width:15px;height:15px;color:var(--accent)}
.cmp-wrap{width:100%;display:grid;gap:10px;justify-items:center}
.cmp-box{position:relative;width:min(100%, calc(80vh * var(--ar)));aspect-ratio:var(--ar);border-radius:4px;overflow:hidden;background:#000;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.cmp-box img.a{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp-box:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cmp-line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0 / .25);pointer-events:none}
.cmp-knob{position:absolute;top:50%;left:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;color:#2c5a4b;display:grid;place-items:center;box-shadow:0 2px 10px rgb(0 0 0 / .35)}
.cmp-knob svg{width:22px;height:22px}
.cmp-chip{position:absolute;bottom:10px;padding:4px 10px;border-radius:999px;background:rgb(17 26 22 / .82);color:#f2f6f3;font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .15s}
.cmp-chip.l{left:10px}.cmp-chip.r{right:10px;background:#2c5a4b}
.cmp-side{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.cmp-side figure{margin:0;display:grid;gap:6px;position:relative}
.cmp-side img{width:100%;max-height:72vh;object-fit:contain;border-radius:4px;background:#000;display:block}
.cmp-side figcaption{font-size:12.5px;color:var(--muted)}
.cmp-side figcaption b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;font-weight:600}
.cmp-note{font-size:12.5px;color:var(--muted);text-align:center;max-width:62ch}
.tsel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tsel select{min-height:32px;padding:4px 8px;max-width:210px;font-size:13px}
.toolbar .segbtns{padding:3px}
.toolbar .segbtns button{min-height:28px;padding:0 10px;flex:none}
.gal{display:grid;gap:8px}
.gal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gal-h h4{font-size:13.5px;font-weight:600}
.gal-h .fine{flex:1;min-width:180px}
.gal-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.gal-th{flex:none;height:96px;border-radius:7px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2);cursor:pointer}
.gal-th img{height:100%;width:auto;display:block}
.gal-th:hover{border-color:var(--line)}
.gal-th[aria-current="true"]{border-color:var(--accent)}
.lb-img{position:relative;background:#000;border-radius:8px;display:grid;place-items:center;min-height:200px}
.lb-img img{max-width:100%;max-height:68vh;object-fit:contain;display:block}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgb(255 255 255 / .9);color:#18261f;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .3)}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.pill.bestand{color:var(--c3)}
details.best{border-top:1px dashed var(--line);padding-top:10px}
details.best>summary{cursor:pointer;list-style:none}
details.best>summary::-webkit-details-marker{display:none}
details.best>summary h4::before{content:"\25B8  "}
details.best[open]>summary h4::before{content:"\25BE  "}
.it.best-it{grid-template-columns:44px minmax(0,1fr) auto;align-items:center;padding:7px 8px;gap:10px}
.it.best-it .it-thumb{width:44px;height:44px}
.it.best-it h5{font-size:13px}
.it.best-it .row{display:flex;gap:4px}
@media (max-width:680px){ .cmp-side{grid-template-columns:1fr} .tsel select{max-width:150px} }
@media (max-width:1080px){
  .budget-grid{grid-template-columns:1fr 1fr}
  .budget-grid>.b-ship{grid-column:1 / -1}
}
@media (max-width:980px){
  .ed-grid{grid-template-columns:minmax(0,1fr)}
  .ed-side{position:static;max-height:none}
  .insp-ctrls{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:680px){
  .steps{grid-template-columns:1fr}

const activePhoto = (r = S.room) => r ? (r.photos.find(p => p.id === r.activePhoto) || r.photos[0] || null) : null;

function pxPerCm(ph) {
  if (ph && ph.plan) return ph.plan.ppc;

  const { a, b, cm } = ph.scale;

function calc(r) {
  const counted = r.items.filter(i => i.counts !== false && !i.bestand);

  for (const i of counted) {
    const v = (i.price || 0) * (i.qty || 1);
    if (i.price == null) missing++;
    goods += v;
    if (i.status === 'gekauft') bought += v;
    byCat.set(i.cat, (byCat.get(i.cat) || 0) + v);
  }
  const retailers = [...new Set(counted.map(i => (i.retailer || '').trim() || 'Ohne Händler'))];
  let ship = 0, shipOpen = 0;
  for (const rt of retailers) { const v = r.shipping[rt]; if (v == null) shipOpen++; else ship += v; }
  const extras=Object.values(r.accessoryCosts||{}).reduce((n,v)=>n+(Number.isFinite(+v)&&+v>0?+v:0),0);
  const total = goods + ship + extras;
  return { extras, counted, byCat, goods, bought, missing, retailers, ship, shipOpen, total, rest: r.budget != null ? r.budget - total : null };
}
function catColors(r) {
  const order = [];
  r.items.forEach(i => { if (!order.includes(i.cat)) order.push(i.cat); });

function roomVariant(ph, mode, cabinet) {
  const out={...ph,placements:ph.placements.map(p=>({...p}))},W=ph.plan.w,D=ph.plan.d;
  if(mode==='roof'){
    const sl=slopeOf(ph.plan),p=out.placements.find(p=>p.id===cabinet),it=p&&getItem(p.itemId);
    if(!sl||!it||!ownDims(it))return {error:'Dachschräge und bestätigte Schrankmaße erforderlich.'};
    const dm=itemDims(it),h=dm.h+(p.elev||0);
    if(h+2>(ph.plan.height||250))return {error:'Der Schrank ist für die Raumhöhe zu hoch (inklusive 2 cm Planungsabstand).'};
    const inset=Math.max(2,(h+2-(sl.knee||0))/slopeTan(sl)),depth=inset+dm.d/2,L=['left','right'].includes(sl.side)?D:W;
    p.rot=({top:0,right:90,bottom:180,left:-90})[sl.side];
    for(let along=dm.w/2+2;along<=L-dm.w/2-2;along+=5){
      const [x,y]=({top:[along,depth],bottom:[along,D-depth],left:[depth,along],right:[W-depth,along]})[sl.side];
      [p.x,p.y]=relFromCm(ph,x,y);
      if(!fitIssues(p,out).length)return {ph:out,note:`Rückkante ca. ${Math.ceil(inset)} cm von der Schrägenwand entfernt. Dieser Abstand schafft Platz für die Schrankhöhe.`};
    }
    return {error:'Kein freier Standort an der Schrägenseite gefunden. Niedrigeren oder schmaleren Schrank wählen oder dort Platz schaffen.'};
  }
  for(const p of out.placements){let [x,y]=plCm(p,ph);if(mode==='x'){x=W-x;p.rot=-(p.rot||0);}if(mode==='y'){y=D-y;p.rot=180-(p.rot||0);}if(mode==='180'){x=W-x;y=D-y;p.rot=(p.rot||0)+180;}if(mode==='90'){[x,y]=[W/2-(y-D/2),D/2+(x-W/2)];p.rot=(p.rot||0)+90;}[p.x,p.y]=relFromCm(ph,x,y);}
  return {ph:out,note:'Nur die Möbel werden neu angeordnet. Raumgeometrie, Dachschräge und Audio-Positionen bleiben unverändert.'};
}

function plStyle(p) { return `left:${p.x * 100}%;top:${p.y * 100}%;width:${effW(p) * 100}%;transform:translate(-50%,-50%) rotate(${p.rot || 0}deg);z-index:${p.z || 1}`; }

function catalogHost(p) { try { return new URL(p.url).hostname.replace(/^www\./,''); } catch { return p.retailer; } }
function wantedMatches(p,k,cat) {
  if (p.cat !== cat) return false;

  if (k === 'Lautsprecher') return p.key === 'lautsprecher';
  return true;

function concreteIdeas(r, f, min = null, max = null, fallbackCat = 'Kleiderschrank') {

    const own = min != null || max != null, low = own ? (min ?? 0) : (band?.[0] ?? 0);
    const high = own ? (max ?? Infinity) : (band?.[1] ?? Infinity);
    const cap = Math.min(cost.rest ?? Infinity, r.catBudgets?.[cat] != null ? r.catBudgets[cat]-(cost.byCat.get(cat)||0) : Infinity);

      const distance = pal.length && /^#[0-9a-f]{6}$/i.test(p.color||'') ? Math.min(...pal.map(h=>cdist(hx(h),hx(p.color)))) : 0;
      return {p,exact,score:(exact?400:0)-distance};
    }).sort((a,b)=>b.score-a.score || (a.p.price??Infinity)-(b.p.price??Infinity));
    const eligible = candidates.filter(({p})=>p.price != null && p.price>=low && p.price<=high && p.price*(p.qty||1)<=cap);
    // Keep different retailers visible instead of filling each group with one shop.
    const chosen=[], hosts=new Set();
    for(const c of eligible) if(!hosts.has(catalogHost(c.p))){chosen.push(c);hosts.add(catalogHost(c.p));if(chosen.length===3)break;}
    for(const c of eligible) if(chosen.length<3&&!chosen.includes(c)) chosen.push(c);
    const unknown=[], unknownHosts=new Set(); for(const c of candidates.filter(c=>c.p.price==null && (!f.style||c.exact))) if(!unknownHosts.has(catalogHost(c.p))){unknown.push(c);unknownHosts.add(catalogHost(c.p));if(unknown.length===2)break;}
    return {k,cat,kw,low,high,cap,products:chosen,unknown};
  });

/* ---------- Placement actions ---------- */
function placeItem(itemId) {
  const ph = activePhoto(), it = getItem(itemId);
  if (!ph) { toast('Füge zuerst ein Raumfoto hinzu.'); return; }
  if (S.cmp) { S.cmp = false; renderTabs(); }
  snapshot();
  const k = pxPerCm(ph), c = catOf(it.cat);
  let w = c.w;
  if (k && it.dims && it.dims.w) w = clamp(it.dims.w * k / ph.w, .02, 1.5);
  const z = Math.max(0, ...ph.placements.map(p => p.z || 0)) + 1;
  const off = (ph.placements.filter(p => p.itemId === itemId).length) * .04;
  const p = { id: uid(), itemId, x: .5 + off, y: (c.sil === 'teppich' ? .85 : c.sil === 'lampe' ? .5 : .64) + off, w, rot: 0, flip: false, op: 1, bri: 100, shadow: c.sil !== 'teppich', z };
  if (ph.plan) {
    [p.x, p.y] = relFromCm(ph, ph.plan.w / 2, ph.plan.d / 2); p.x += off; p.y += off;
    p.shadow = false;
  }
  ph.placements.push(p);
  S.sel = p.id; S.hideFurn = false;

  stageEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const PL_ACTS = {

  'pl-flip'() { const p = selPl(); if (!p) return; snapshot(); p.flip = !p.flip; touch(); refreshSelEl(); renderInspector(); },
  'pl-shadow'() { const p = selPl(); if (!p) return; snapshot(); p.shadow = p.shadow === false; touch(); refreshSelEl(); renderInspector(); },
  'pl-front'() { const p = selPl(); if (!p) return; snapshot(); const ph = activePhoto(); p.z = Math.max(...ph.placements.map(q => q.z || 0)) + 1; touch(); renderStage(); },
  'pl-back'() { const p = selPl(); if (!p) return; snapshot(); const ph = activePhoto(); const min = Math.min(...ph.placements.map(q => q.z || 0)); ph.placements.forEach(q => { if (q !== p) q.z = (q.z || 0) + 1; }); p.z = min; touch(); renderStage(); },
  'pl-dup'() { const p = selPl(); if (!p) return; snapshot(); const ph = activePhoto(); const n = { ...p, id: uid(), x: p.x + .04, y: p.y + .03, z: Math.max(...ph.placements.map(q => q.z || 0)) + 1 }; ph.placements.push(n); S.sel = n.id; touch(); renderStage(); renderInspector(); renderSide(); renderTabs(); },
  'pl-real'() { const p = selPl(); if (!p) return; const ph = activePhoto(), it = getItem(p.itemId), k = pxPerCm(ph); if (!k || !it.dims?.w) return; snapshot(); p.w = it.dims.w * k / ph.w; touch(); renderStage(); renderInspector(); },

};

/* ================= Dachkanten aus einem Foto vorschlagen ================= */
function findDiagonalCandidates(p, w, h) {
  const gray = new Float32Array(w * h);
  for (let k = 0; k < gray.length; k++) gray[k] = .299 * p[k * 4] + .587 * p[k * 4 + 1] + .114 * p[k * 4 + 2];
  const edges = [];
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const k = y * w + x;
    const gx = -gray[k - w - 1] + gray[k - w + 1] - 2 * gray[k - 1] + 2 * gray[k + 1] - gray[k + w - 1] + gray[k + w + 1];
    const gy = -gray[k - w - 1] - 2 * gray[k - w] - gray[k - w + 1] + gray[k + w - 1] + 2 * gray[k + w] + gray[k + w + 1];
    if (Math.hypot(gx, gy) > 180) edges.push([x, y]);
  }
  const stride = Math.max(1, Math.ceil(edges.length / 10000)), pts = edges.filter((_, i) => i % stride === 0), diag = Math.ceil(Math.hypot(w, h)), bins = diag + 1;
  const angles = []; for (let a = 18; a <= 72; a += 3) angles.push(a); for (let a = 108; a <= 162; a += 3) angles.push(a);
  const peaks = [];
  for (const angle of angles) {
    const a = angle * Math.PI / 180, nx = -Math.sin(a), ny = Math.cos(a), votes = new Uint16Array(bins);
    for (const [x, y] of pts) { const b = Math.round((x * nx + y * ny + diag) / 2); if (b >= 0 && b < bins) votes[b]++; }
    for (let b = 0; b < bins; b++) if (votes[b] >= Math.max(8, Math.min(w, h) * .1 / stride)) peaks.push({ angle, rho: b * 2 - diag, votes: votes[b] });
  }
  peaks.sort((a, b) => b.votes - a.votes);
  const chosen = [], res = [];
  for (const pk of peaks) {
    if (chosen.some(q => Math.abs(q.angle - pk.angle) < 9 && Math.abs(q.rho - pk.rho) < 10)) continue;
    const a = pk.angle * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
    const line = pts.filter(([x, y]) => Math.abs(x * nx + y * ny - pk.rho) <= 2.5);
    if (line.length < 8) continue;
    const t = line.map(([x, y]) => x * dx + y * dy), mn = Math.min(...t), mx = Math.max(...t);
    if (mx - mn < Math.min(w, h) * .3) continue;
    const c01 = n => clamp(n, 0, 1);
    res.push({ a: [c01((pk.rho * nx + mn * dx) / w), c01((pk.rho * ny + mn * dy) / h)], b: [c01((pk.rho * nx + mx * dx) / w), c01((pk.rho * ny + mx * dy) / h)], strength: pk.votes });
    chosen.push(pk);
    if (res.length === 4) break;
  }
  return res;
}

      <div class="dlg-f"><span class="grow"></span><button class="btn" data-c="0">Abbrechen</button><button class="btn primary" data-c="1" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(okLabel)}</button></div>`);
    const done = v => { dlg2.removeEventListener('close', onClose); closeDlg(dlg2); res(v); };
    const onClose = () => res(false);
    dlg2.addEventListener('close', onClose, { once: true });
    $$('[data-c]', dlg2).forEach(b => b.onclick = () => done(b.dataset.c === '1'));
  });
}

  $('#f-tol').onchange = () => { if (cur && cur !== orig) runCut(); };
  $('#f-erase').onclick = async () => { if (!cur) return; const out = await cutoutEditor(cur); if (out) { cur = out; paint(); } };

    if (!ok) return;
    snapshot();
    const r = S.room;
    r.items = r.items.filter(x => x.id !== it.id);
    r.photos.forEach(p => p.placements = p.placements.filter(q => q.itemId !== it.id));

  $('#it-form').onsubmit = e => {

    const name = $('#f-name').value.trim();
    if (!name) { $('#f-name').focus(); return; }
    Object.assign(it, {
      name, cat: $('#f-cat').value, retailer: $('#f-ret').value.trim(), url: $('#f-url').value.trim(),
      price: num($('#f-price').value), qty: clamp(parseInt($('#f-qty').value) || 1, 1, 99),
      dims: { w: num($('#f-dw').value), d: num($('#f-dd').value), h: num($('#f-dh').value) },
      counts: $('#f-counts').checked, note: $('#f-note').value.trim(), img: cur || null,
    });
    const r = S.room;
    const place = isNew && $('#f-place')?.checked;
    if (isNew) r.items.push(it); else Object.assign(getItem(it.id), it);
    closeDlg(dlg); touch();
    if (isNew) { S.tab = 'auswahl'; LS.set('tab', S.tab); }
    renderAfterItems();
    if (place) placeItem(it.id); else toast(isNew ? 'Zur Auswahl hinzugefügt' : 'Gespeichert');
  };
}

function planDialog(ph) {
  const old = ph ? ph.plan : null;
  const sp = old || { w: 400, d: 400, walls: { t: 11.5, r: 11.5, b: 36.5, l: 11.5 }, slope: null, windows: [{ wall: 'bottom', from: 140, width: 120 }], door: { type: 'wall', wall: 'top', from: 20, width: 90, leg: 106 }, label: S.room.name };
  const win = (sp.windows && sp.windows[0]) || { wall: 'none', from: 100, width: 120 };
  const dr = sp.door || { type: 'none', wall: 'top', from: 20, width: 90, leg: 106 };
  const dv = !sp.door ? 'none' : dr.type === 'corner' ? 'c-' + dr.corner : 'w-' + dr.wall;
  const SIDES = [['top', 'oben'], ['right', 'rechts'], ['bottom', 'unten'], ['left', 'links']];
  const opt = (list, v) => list.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('');
  const cm = (id, v, label) => `<label class="field"><span>${label}</span><div class="money"><input class="input" id="${id}" inputmode="decimal" value="${fnum(v)}"><em>cm</em></div></label>`;
  openDlg(dlg, `<form id="pl-form" autocomplete="off">
    <div class="dlg-h"><div><p class="eyebrow">Draufsicht im Maßstab</p><h2>${old ? 'Grundriss bearbeiten' : 'Grundriss aus Maßen'}</h2></div><button type="button" class="icon-btn flat" data-close aria-label="Schließen">${I('x')}</button></div>
    <div class="dlg-b">
      <p class="hint">Innenmaße in Zentimetern. „Oben“, „rechts“ usw. meinen die Seiten in der Grundriss-Ansicht. Abstände zählen von der oberen bzw. linken Ecke.</p>
      <label class="field"><span>Bezeichnung</span><input class="input" id="pd-label" value="${esc(sp.label || S.room.name)}"></label>
      <div class="row3">${cm('pd-w', sp.w, 'Breite (links ↔ rechts)')}${cm('pd-d', sp.d, 'Tiefe (oben ↔ unten)')}${cm('pd-h', sp.height ?? 250, 'Raumhöhe')}</div>
      <div class="field"><span>Außenwände</span><div class="inline" style="flex-wrap:wrap;gap:16px">${SIDES.map(([k, l]) => `<label class="check"><input type="checkbox" id="pd-o-${k}" ${sp.walls[k[0]] > 20 ? 'checked' : ''}> ${l}</label>`).join('')}</div></div>
      <div class="row3">
        <label class="field"><span>Dachschräge an Wand</span><select class="input" id="pd-ss">${opt([['none', 'keine'], ...SIDES], sp.slope ? sp.slope.side : 'none')}</select></label>
        ${cm('pd-sk', sp.slope?.knee ?? 100, 'Drempelhöhe')}
        <label class="field"><span>Dachneigung</span><div class="money"><input class="input" id="pd-sp" inputmode="decimal" value="${fnum(sp.slope?.pitch ?? 40)}"><em>°</em></div></label>
      </div>
      <div class="row3">
        <label class="field"><span>Fenster in Wand</span><select class="input" id="pd-ww">${opt([['none', 'kein Fenster'], ...SIDES], win.wall)}</select></label>
        ${cm('pd-wf', win.from, 'Abstand ab Ecke')}${cm('pd-wb', win.width, 'Fensterbreite')}
      </div>
      <div class="row3">
        <label class="field"><span>Tür</span><select class="input" id="pd-dt">${opt([['none', 'keine Tür'], ['w-top', 'Wand oben'], ['w-right', 'Wand rechts'], ['w-bottom', 'Wand unten'], ['w-left', 'Wand links'], ['c-tl', 'Schräge Ecke oben links'], ['c-tr', 'Schräge Ecke oben rechts'], ['c-bl', 'Schräge Ecke unten links'], ['c-br', 'Schräge Ecke unten rechts']], dv)}</select></label>
        ${cm('pd-df', dr.from ?? 20, 'Abstand ab Ecke')}${cm('pd-db', dr.width ?? 90, 'Türbreite')}
      </div>
      <div class="row3">${cm('pd-dl', dr.leg ?? 106, 'Schräge Ecke: Schenkel')}<p class="hint" style="grid-column:span 2;align-self:end">Nur bei einer Tür in einer abgeschrägten Ecke: wie weit die Schräge auf beiden Wänden zurückspringt.</p></div>
    </div>
    <div class="dlg-f"><span class="grow"></span><button type="button" class="btn" data-close>Abbrechen</button><button class="btn primary" type="submit">${I('check')} ${old ? 'Grundriss aktualisieren' : 'Grundriss anlegen'}</button></div></form>`);
  setTimeout(() => $('#pd-w')?.focus(), 30);
  $('#pl-form').onsubmit = e => {
    e.preventDefault();
    const w = num($('#pd-w').value), d = num($('#pd-d').value);
    if (!w || !d || w < 50 || d < 50 || w > 3000 || d > 3000) { toast('Bitte Breite und Tiefe zwischen 50 und 3.000 cm eintragen.'); return; }
    const walls = {};
    SIDES.forEach(([k]) => { const o = old && old.walls[k[0]] > 20 ? old.walls[k[0]] : 36.5; walls[k[0]] = $('#pd-o-' + k).checked ? o : 11.5; });
    const ss = $('#pd-ss').value, ww = $('#pd-ww').value, dt = $('#pd-dt').value;
    const sp2 = {
      ...(old || {}), label: $('#pd-label').value.trim(), w, d, walls, height: clamp(num($('#pd-h').value) || 250, 150, 600),
      slope: ss === 'none' ? null : { side: ss, knee: num($('#pd-sk').value) ?? 100, pitch: clamp(num($('#pd-sp').value) || 40, 5, 75) },
      windows: ww === 'none' ? [] : [{ wall: ww, from: num($('#pd-wf').value) ?? 0, width: num($('#pd-wb').value) || 100 }],
      door: dt === 'none' ? null : dt.startsWith('c-')
        ? { type: 'corner', corner: dt.slice(2), leg: num($('#pd-dl').value) || 106, width: num($('#pd-db').value) || 90 }
        : { type: 'wall', wall: dt.slice(2), from: num($('#pd-df').value) ?? 0, width: num($('#pd-db').value) || 90 },
    };
    delete sp2.ppc; delete sp2.M;
    const out = paintPlan(sp2);
    closeDlg(dlg);
    if (ph) {
      const o = ph.plan;
      ph.placements.forEach(q => {
        const xc = q.x * ph.w / o.ppc - o.M, yc = q.y * ph.h / o.ppc - o.M;
        q.x = (out.plan.M + xc) * out.plan.ppc / out.w; q.y = (out.plan.M + yc) * out.plan.ppc / out.h;
      });
      Object.assign(ph, { src: out.src, w: out.w, h: out.h, plan: out.plan });
      S.undo = []; S.redo = []; touch(); renderEditorAll(); toast('Grundriss aktualisiert');
    } else addPhoto(out);
  };
}

function shoppingList() {
  const r = S.room, c = calc(r);
  const by = new Map();
  c.counted.forEach(i => { const k = (i.retailer || '').trim() || 'Ohne Händler'; if (!by.has(k)) by.set(k, []); by.get(k).push(i); });
  const alts = r.items.filter(i => i.counts === false && !i.bestand);
  let rows = '';
  for (const [rt, items] of by) {
    const sub = items.reduce((a, i) => a + (i.price || 0) * (i.qty || 1), 0), ship = r.shipping[rt];
    rows += `<tr class="ret"><td colspan="4">${esc(rt)}</td></tr>`;
    rows += items.map(i => `<tr><td>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>` : esc(i.name)}<div class="fine">${esc(i.cat)}${i.status === 'gekauft' ? ' · gekauft' : ''}</div></td><td class="r">${i.qty || 1}×</td><td class="r">${i.price == null ? '<span style="color:var(--warn)">offen</span>' : eur(i.price)}</td><td class="r">${eur((i.price || 0) * (i.qty || 1))}</td></tr>`).join('');
    rows += `<tr><td colspan="3" class="muted">Versand</td><td class="r">${ship == null ? '<span style="color:var(--warn)">offen</span>' : eur(ship)}</td></tr>`;
    rows += `<tr class="sub"><td colspan="3">Summe ${esc(rt)}</td><td class="r">${eur(sub + (ship || 0))}</td></tr>`;
  }
  openDlg(dlg, `<div class="dlg-h"><div><p class="eyebrow">${esc(r.name)}</p><h2>Einkaufsliste</h2></div><button type="button" class="icon-btn flat" data-close aria-label="Schließen">${I('x')}</button></div>
    <div class="dlg-b">
      ${(c.counted.length || c.extras) ? `<div class="tbl-wrap"><table class="list-tbl"><thead><tr><th>Möbel</th><th class="r">Anzahl</th><th class="r">Einzeln</th><th class="r">Summe</th></tr></thead><tbody>${rows}${c.extras?`<tr><td colspan="3">Audio- und Zubehörkosten</td><td class="r">${eur(c.extras)}</td></tr>`:''}</tbody></table></div>
      <div class="list-total"><span class="muted">Gesamt inkl. Versand und Zubehör${r.budget != null ? ` · Budget ${eur(r.budget)}` : ''}</span><span class="big" style="font-size:28px">${eur(c.total)}</span></div>
      ${alts.length ? `<p class="hint">Nicht enthalten (Alternativen): ${alts.map(a => esc(a.name) + (a.price != null ? ' ' + eur(a.price) : '')).join(', ')}</p>` : ''}
      <textarea class="input copy-area" id="sl-text" readonly hidden></textarea>`
      : '<p class="muted">Noch keine Möbel im Budget. Füge Möbel hinzu oder nimm Alternativen ins Budget auf.</p>'}
    </div>
    <div class="dlg-f"><span class="grow"></span>
      ${(c.counted.length || c.extras) ? `<button class="btn" id="sl-copy">${I('copy')} Als Text kopieren</button><button class="btn primary" id="sl-csv">${I('download')} CSV für Excel</button>` : `<button class="btn" data-close>Schließen</button>`}
    </div>`);
  if (!c.counted.length && !c.extras) return;
  const text = () => {
    let t = `Einkaufsliste – ${r.name}\n`;
    for (const [rt, items] of by) {
      t += `\n${rt}\n`;

/* ================= Backup ================= */
async function exportBackup() {
  const data = JSON.stringify({ app: 'raumplaner-studio', version: 1, exported: new Date().toISOString(), rooms: S.rooms });
  await saveFile(`raumplaner-sicherung-${new Date().toISOString().slice(0, 10)}.json`, data, 'application/json');
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    const rooms = Array.isArray(data) ? data : data.rooms;
    if (!Array.isArray(rooms)) throw 0;
    let n = 0;
    for (const r of rooms) {
      if (!r || !r.id || !Array.isArray(r.items) || !Array.isArray(r.photos)) continue;
      r.catBudgets ||= {}; r.shipping ||= {};
      if (r.inspiration && !/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(String(r.inspiration.img || ''))) delete r.inspiration;
      if (r.inspiration) r.inspiration.palette = (r.inspiration.palette || []).filter(p => p && /^#[0-9a-f]{6}$/i.test(String(p.hex)));
      if (Array.isArray(r.palette)) r.palette = r.palette.filter(p => p && /^#[0-9a-f]{6}$/i.test(String(p.hex)));
      const i = S.rooms.findIndex(x => x.id === r.id);
      if (i >= 0) S.rooms[i] = r; else S.rooms.push(r);
      S.storage && await DB.put(r); n++;
    }
    toast(n ? `${n} Raum${n > 1 ? 'räume' : ''} geladen`.replace('Raumräume', 'Räume') : 'In der Datei wurden keine Räume gefunden.');
    renderHome();
  } catch { toast('Diese Datei ist keine Raumplaner-Sicherung.'); }
}
